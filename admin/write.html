<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글쓰기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Noto+Serif+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/content.css">
  <link rel="stylesheet" href="../css/pages/write.css">
</head>
<body>
  <form id="write-form" class="write-page">
    <!-- 상단 바 -->
    <header class="write-topbar">
      <a class="site-logo" href="../blog.html">한채</a>
      <div class="write-buttons">
        <button type="button" id="cancel-button" class="btn">취소</button>
        <button type="submit" id="submit-button" class="btn btn-primary">발행</button>
      </div>
    </header>

    <!-- 툴바 -->
    <div id="toolbar" class="toolbar" role="toolbar" aria-label="서식">
      <select data-block aria-label="문단 형식" title="문단 형식">
        <option value="p">본문</option>
        <option value="h2">제목 1</option>
        <option value="h3">제목 2</option>
        <option value="h4">제목 3</option>
      </select>

      <span class="divider"></span>

      <button type="button" data-command="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
      <button type="button" data-command="italic" title="기울임 (Ctrl+I)"><i>I</i></button>
      <button type="button" data-command="underline" title="밑줄 (Ctrl+U)"><u>U</u></button>
      <button type="button" data-command="strikeThrough" title="취소선"><s>S</s></button>
      <label class="color-picker" title="글자색">
        <span>A</span>
        <input type="color" data-color value="#dc2626" aria-label="글자색">
      </label>

      <span class="divider"></span>

      <button type="button" data-command="justifyLeft" title="왼쪽 정렬">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M2 6.5h8M2 10h12M2 13.5h8"/></svg>
      </button>
      <button type="button" data-command="justifyCenter" title="가운데 정렬">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M4 6.5h8M2 10h12M4 13.5h8"/></svg>
      </button>
      <button type="button" data-command="justifyRight" title="오른쪽 정렬">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M6 6.5h8M2 10h12M6 13.5h8"/></svg>
      </button>

      <span class="divider"></span>

      <button type="button" data-command="insertUnorderedList" title="글머리 목록">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4h8M6 8h8M6 12h8"/><circle cx="2.5" cy="4" r="1"/><circle cx="2.5" cy="8" r="1"/><circle cx="2.5" cy="12" r="1"/></svg>
      </button>
      <button type="button" data-command="insertOrderedList" title="번호 목록">1.</button>
      <button type="button" data-action="quote" title="인용">❝</button>
      <button type="button" data-action="code" title="코드 블록">&lt;/&gt;</button>
      <button type="button" data-command="insertHorizontalRule" title="구분선">―</button>

      <span class="divider"></span>

      <button type="button" data-action="link" title="링크">링크</button>
      <button type="button" data-action="image" title="이미지">사진</button>
      <button type="button" data-command="removeFormat" title="서식 지우기">서식 지우기</button>
    </div>

    <!-- 작성 영역 -->
    <main class="write-body">
      <div class="write-meta">
        <input id="category" list="category-list" placeholder="카테고리" aria-label="카테고리" autocomplete="off">
        <datalist id="category-list"></datalist>
      </div>

      <input id="title" class="write-title" placeholder="제목을 입력하세요" aria-label="제목" autocomplete="off">

      <div id="editor" class="post-content editor" data-placeholder="내용을 입력하세요" aria-label="본문" role="textbox" aria-multiline="true"></div>

      <div class="write-tags">
        <input id="tags" placeholder="태그 입력 (쉼표로 구분, 예: HTML, CSS)" aria-label="태그" autocomplete="off">
      </div>
    </main>
  </form>

  <script src="../js/store.js"></script>
  <script src="../js/content.js"></script>
  <script src="../js/editor.js"></script>
  <script src="../js/pages/write.js"></script>
</body>
</html>
