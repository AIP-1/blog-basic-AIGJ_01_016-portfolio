  <!-- 문이 열린 뒤 나타나는 로그인 / 회원가입 -->
  <div id="auth-panel" class="auth-panel" hidden>
    <div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <button type="button" class="auth-close" aria-label="닫기">×</button>
      <h2 id="auth-title" class="auth-title">어서 오십시오</h2>

      <div class="auth-tabs" role="tablist">
        <button type="button" role="tab" id="tab-login" data-tab="login" aria-controls="login-form" aria-selected="true">로그인</button>
        <button type="button" role="tab" id="tab-signup" data-tab="signup" aria-controls="signup-form" aria-selected="false">회원가입</button>
      </div>

      <form id="login-form" class="auth-form" role="tabpanel" aria-labelledby="tab-login" novalidate>
        <label>
          이메일
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          비밀번호
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <p class="auth-error" role="alert"></p>
        <button type="submit" class="auth-submit">로그인</button>
        <p class="auth-switch">아직 회원이 아니신가요? <button type="button" data-tab="signup">회원가입</button></p>
      </form>

      <form id="signup-form" class="auth-form" role="tabpanel" aria-labelledby="tab-signup" novalidate hidden>
        <label>
          닉네임
          <input type="text" name="nickname" autocomplete="nickname" minlength="2" maxlength="12" required>
        </label>
        <label>
          이메일
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          비밀번호 <span class="hint">8자 이상</span>
          <input type="password" name="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label>
          비밀번호 확인
          <input type="password" name="passwordConfirm" autocomplete="new-password" required>
        </label>
        <p class="auth-error" role="alert"></p>
        <button type="submit" class="auth-submit">회원가입</button>
        <p class="auth-switch">이미 회원이신가요? <button type="button" data-tab="login">로그인</button></p>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
